name: Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/setup.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
